.leaflet-popup {

.leaflet-popup-content-wrapper {

<style>
*{box-sizing:border-box} html,body{margin:0;height:100%;font-family:'Segoe UI',system-ui,Arial,sans-serif;color:#223}
#app{display:flex;flex-direction:column;height:100%}
.bar{background:#273B84;color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:1000}
.bar h1{font-size:16px;margin:0;font-weight:800;white-space:nowrap}
.bar .sub{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.04em}
select,.nav{font-size:15px;padding:8px 10px;border-radius:9px;border:0;font-weight:700}
select{min-width:150px}.nav{background:#16C7BF;color:#06302e;cursor:pointer}.nav:disabled{opacity:.4;cursor:default}
.stat{font-size:13px;background:rgba(255,255,255,.14);padding:6px 11px;border-radius:9px;font-weight:600}.stat b{font-weight:800}
.main{flex:1;display:flex;min-height:0}#map{flex:1;min-height:0}
.side{width:280px;background:#f7f8fc;border-left:1px solid #e3e7f1;overflow-y:auto;padding:14px}
.side h2{font-size:13px;color:#273B84;margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}
.side .hint{font-size:12px;color:#6b7490;margin-bottom:12px}
.scard{background:#fff;border:1px solid #e7eaf3;border-radius:12px;padding:12px;margin-bottom:10px}
.scard .zt{font-weight:800;color:#273B84;font-size:16px}.scard .zm{font-size:12px;color:#6b7490;margin:2px 0 8px}
.calles{list-style:none;margin:0;padding:0}.calles li{font-size:13px;padding:3px 0;border-bottom:1px solid #f0f2f8}
.badge{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:7px;vertical-align:middle}
@media(max-width:720px){.main{flex-direction:column}.side{width:auto;max-height:42%;border-left:0;border-top:1px solid #e3e7f1}}
.leaflet-container{background:#dfe6ef}
</style></head>
